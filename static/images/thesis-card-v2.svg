<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-label="Deterministic automation pipeline with an LLM reasoning node at its center">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e8eef6"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dbe6f5" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#dbe6f5" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#dbe6f5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9eef4"/>
      <stop offset="0.5" stop-color="#cdd7e2"/>
      <stop offset="1" stop-color="#aebccd"/>
    </linearGradient>
    <linearGradient id="llm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#60a5fa" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#d2dbe6"/>
    </pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M1,1 L7,4.5 L1,8" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="640" height="280" fill="url(#bg)"/>
  <rect width="640" height="280" fill="url(#dots)"/>

  <!-- data highway band -->
  <rect x="0" y="116" width="640" height="48" fill="url(#band)"/>

  <!-- ===== circuit traces (muted, behind everything) ===== -->
  <g fill="none" stroke="#b7c3d3" stroke-width="1.6" opacity="0.9">
    <path d="M150 112 L150 86 L250 86 L250 110"/>
    <path d="M205 170 L205 206 L300 206 L300 182"/>
    <path d="M470 110 L470 84 L560 84 L560 112"/>
    <path d="M455 170 L455 200 L378 200"/>
  </g>
  <g fill="#b7c3d3" opacity="0.9">
    <circle cx="150" cy="86" r="3"/><circle cx="250" cy="86" r="3"/>
    <circle cx="205" cy="206" r="3"/><circle cx="470" cy="84" r="3"/>
    <circle cx="560" cy="84" r="3"/><circle cx="455" cy="200" r="3"/>
  </g>
  <!-- a couple of abstract logic-gate nodes on the traces -->
  <g fill="#ffffff" stroke="#b7c3d3" stroke-width="1.6">
    <path d="M286 78 h10 a8 8 0 0 1 0 16 h-10 Z"/>
    <path d="M520 76 h10 a8 8 0 0 1 0 16 h-10 Z"/>
  </g>

  <!-- ===== main conduit ===== -->
  <rect x="0" y="133" width="640" height="14" rx="7" fill="url(#pipe)"/>
  <line x1="0" y1="140" x2="640" y2="140" stroke="#f1f5f9" stroke-width="1.5" opacity="0.7"/>
  <!-- flow arrowheads on the conduit -->
  <g stroke="#64748b" stroke-width="2">
    <line x1="138" y1="140" x2="172" y2="140" marker-end="url(#arrow)"/>
    <line x1="250" y1="140" x2="276" y2="140" marker-end="url(#arrow)"/>
    <line x1="364" y1="140" x2="392" y2="140" marker-end="url(#arrow)"/>
    <line x1="514" y1="140" x2="540" y2="140" marker-end="url(#arrow)"/>
  </g>
  <!-- flow chevrons at the far ends -->
  <g fill="none" stroke="#93b4e8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 132 l7 8 -7 8"/><path d="M34 132 l7 8 -7 8"/>
    <path d="M598 132 l7 8 -7 8"/><path d="M610 132 l7 8 -7 8"/>
  </g>

  <!-- ===== process modules ===== -->
  <!-- data input -->
  <rect x="64" y="116" width="60" height="48" rx="9" fill="#ffffff" stroke="#c4cfdc" stroke-width="2"/>
  <path d="M86 130 L104 140 L86 150 Z" fill="#7e8ca0"/>
  <g stroke="#c4cfdc" stroke-width="2" stroke-linecap="round">
    <line x1="56" y1="128" x2="64" y2="128"/><line x1="56" y1="140" x2="64" y2="140"/><line x1="56" y1="152" x2="64" y2="152"/>
  </g>

  <!-- rule-based logic -->
  <rect x="176" y="112" width="74" height="56" rx="9" fill="#ffffff" stroke="#c4cfdc" stroke-width="2"/>
  <g fill="none" stroke="#7e8ca0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="186" y1="130" x2="198" y2="130"/><line x1="186" y1="150" x2="198" y2="150"/>
    <path d="M198 122 h14 a16 18 0 0 1 0 36 h-14 Z"/>
    <line x1="228" y1="140" x2="240" y2="140"/>
  </g>

  <!-- deterministic process (step-function glyph) -->
  <rect x="392" y="112" width="74" height="56" rx="9" fill="#ffffff" stroke="#c4cfdc" stroke-width="2"/>
  <polyline points="404,154 404,144 418,144 418,132 432,132 432,122 452,122" fill="none" stroke="#7e8ca0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- output node -->
  <rect x="548" y="118" width="56" height="44" rx="9" fill="#ffffff" stroke="#c4cfdc" stroke-width="2"/>
  <g stroke="#c4cfdc" stroke-width="2" stroke-linecap="round">
    <line x1="560" y1="132" x2="592" y2="132"/><line x1="560" y1="140" x2="592" y2="140"/><line x1="560" y1="148" x2="580" y2="148"/>
  </g>

  <!-- ===== central LLM reasoning node ===== -->
  <rect x="313" y="0" width="14" height="280" fill="url(#beam)"/>
  <line x1="320" y1="0" x2="320" y2="280" stroke="#bfdbfe" stroke-width="1.5" opacity="0.6"/>
  <circle cx="320" cy="140" r="60" fill="url(#glow)"/>

  <!-- pipe flanges framing the node -->
  <rect x="258" y="124" width="9" height="32" rx="2.5" fill="#aebccd"/>
  <rect x="373" y="124" width="9" height="32" rx="2.5" fill="#aebccd"/>

  <!-- hexagon -->
  <path d="M320 96 L358 118 L358 162 L320 184 L282 162 L282 118 Z" fill="url(#llm)" stroke="#1e40af" stroke-width="1.5"/>
  <!-- subtle model/graph motif inside (not a brain) -->
  <g opacity="0.45" stroke="#dbeafe" stroke-width="1.4">
    <line x1="300" y1="116" x2="340" y2="118"/>
    <line x1="300" y1="116" x2="302" y2="158"/>
    <line x1="340" y1="118" x2="338" y2="160"/>
    <line x1="302" y1="158" x2="338" y2="160"/>
    <line x1="300" y1="116" x2="338" y2="160"/>
  </g>
  <g fill="#eff6ff" opacity="0.7">
    <circle cx="300" cy="116" r="2.6"/><circle cx="340" cy="118" r="2.6"/>
    <circle cx="302" cy="158" r="2.6"/><circle cx="338" cy="160" r="2.6"/>
  </g>
  <text x="320" y="146" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#ffffff" letter-spacing="0.5">LLM</text>
</svg>
